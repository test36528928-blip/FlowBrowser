name: Chromium Build Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-windows-runner:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Inspect runner capacity and Chromium prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=== CPU ==="
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "Processor: $($cpu[0].Name)"
          Write-Host "Logical processors: $env:NUMBER_OF_PROCESSORS"

          Write-Host "=== RAM ==="
          $os = Get-CimInstance Win32_OperatingSystem
          $totalRam = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
          $freeRam = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
          Write-Host "Total RAM: $totalRam GB"
          Write-Host "Free RAM: $freeRam GB"

          Write-Host "=== DISKS ==="
          $disks = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3"
          foreach ($disk in $disks) {
            $total = [math]::Round($disk.Size / 1GB, 2)
            $free = [math]::Round($disk.FreeSpace / 1GB, 2)
            Write-Host "$($disk.DeviceID) Total: $total GB | Free: $free GB"
          }

          Write-Host "=== D DRIVE WRITE TEST (16 MB) ==="
          $testDir = "D:\FlowBrowser-Preflight"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          $testFile = Join-Path $testDir "write-test.bin"
          $bytes = New-Object byte[] (16MB)
          [System.IO.File]::WriteAllBytes($testFile, $bytes)
          $written = (Get-Item $testFile).Length
          Remove-Item $testFile -Force
          Remove-Item $testDir -Force
          Write-Host "PASS: wrote and removed $written bytes on D:"

          Write-Host "=== AVAILABLE BUILD TOOLS ==="
          foreach ($tool in @("git", "python", "py", "ninja", "gn", "clang-cl", "cmake", "7z")) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host "$tool : $($cmd.Source)"
              if ($tool -in @("git", "python", "ninja", "cmake")) {
                & $tool --version 2>&1 | Select-Object -First 1
              }
            } else {
              Write-Host "$tool : NOT FOUND"
            }
          }

          Write-Host "=== VISUAL STUDIO C++ TOOLCHAIN ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vsPath) {
              Write-Host "Visual Studio: $vsPath"
              $cl = Get-ChildItem -Path (Join-Path $vsPath "VC\Tools\Llvm\bin\clang-cl.exe") -ErrorAction SilentlyContinue
              if ($cl) { Write-Host "LLVM clang-cl: $($cl.FullName)" }
            } else {
              Write-Host "Visual Studio C++ workload: NOT FOUND"
            }
          } else {
            Write-Host "vswhere.exe: NOT FOUND"
          }

          Write-Host "=== D DRIVE TOP-LEVEL USAGE (READ-ONLY) ==="
          Get-ChildItem D:\ -Force -ErrorAction SilentlyContinue |
            ForEach-Object {
              if ($_.PSIsContainer) {
                $bytesUsed = (Get-ChildItem $_.FullName -Force -Recurse -File -ErrorAction SilentlyContinue |
                  Measure-Object -Property Length -Sum).Sum
                if ($null -eq $bytesUsed) { $bytesUsed = 0 }
                [pscustomobject]@{
                  Folder = $_.FullName
                  ApproxGB = [math]::Round($bytesUsed / 1GB, 2)
                }
              }
            } | Sort-Object ApproxGB -Descending | Select-Object -First 15 | Format-Table -AutoSize

          Write-Host "=== PREFLIGHT ASSESSMENT ==="
          if ($freeRam -lt 8) { Write-Host "WARNING: RAM is below 8 GiB; a full Chromium build may fail or be extremely slow." }
          $d = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'"
          $dFree = [math]::Round($d.FreeSpace / 1GB, 2)
          if ($dFree -lt 100) { Write-Host "WARNING: D: has less than 100 GB free; full Chromium checkout/build is not recommended." }
          Write-Host "No Chromium source was downloaded. No runner directories were deleted."
      - name: Install Chromium GN from official CIPD package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $depotTools = "D:\FlowBrowserTools\depot_tools"
          $gnRoot = "D:\FlowBrowserTools\gn"
          New-Item -ItemType Directory -Force -Path "D:\FlowBrowserTools" | Out-Null

          if (-not (Test-Path (Join-Path $depotTools "cipd.bat"))) {
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $depotTools
            if ($LASTEXITCODE -ne 0) { throw "depot_tools checkout failed" }
          }

          $cipd = Join-Path $depotTools "cipd.bat"
          if (-not (Test-Path $cipd)) { throw "CIPD client wrapper not found in depot_tools" }

          New-Item -ItemType Directory -Force -Path $gnRoot | Out-Null
          & $cipd install gn/gn/windows-amd64 git_revision:e44942b445d9376451f7d519965dae036efde5bc -root $gnRoot
          if ($LASTEXITCODE -ne 0) { throw "GN CIPD installation failed" }

          $gnExe = Join-Path $gnRoot "gn.exe"
          if (-not (Test-Path $gnExe)) {
            $found = Get-ChildItem $gnRoot -Filter gn.exe -Recurse -File | Select-Object -First 1
            if ($found) { $gnExe = $found.FullName }
          }
          if (-not (Test-Path $gnExe)) { throw "GN installed but gn.exe was not found" }

          & $gnExe --version
          if ($LASTEXITCODE -ne 0) { throw "GN version check failed" }
          Write-Host "GN installed successfully at: $gnExe"
