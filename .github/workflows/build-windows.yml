name: Build FlowBrowser v2.0.0 for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v2.0.0" ]

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 CEF build and release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Restore NuGet dependencies
        run: dotnet restore FlowBrowser.csproj

      - name: Publish CEF application (keep native runtime files)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path publish) { Remove-Item publish -Recurse -Force }
          dotnet publish FlowBrowser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "publish\FlowBrowser.exe")) { throw "FlowBrowser.exe was not produced." }
          if (-not (Get-ChildItem publish -Filter "libcef.dll" -Recurse -File)) { throw "CEF native runtime libcef.dll is missing from publish output." }
          if (-not (Get-ChildItem publish -Filter "CefSharp.BrowserSubprocess.exe" -Recurse -File)) { throw "CefSharp browser subprocess is missing from publish output." }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" FlowBrowser.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer-output\FlowBrowser-Setup-x64.exe")) { throw "Inno Setup installer was not created." }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath FlowBrowser-Portable-x64.zip -Force

      # Actions artifact upload intentionally omitted: this repository has hit
      # its Actions artifact storage quota. Release assets are uploaded directly below.
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v2.0.0')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: FlowBrowser v2.0.0
          generate_release_notes: true
          files: |
            installer-output/FlowBrowser-Setup-x64.exe
            FlowBrowser-Portable-x64.zip
