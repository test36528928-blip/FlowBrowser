name: FlowBrowser CEF Windows CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    name: CEF Windows x64 doğrulama
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: .NET 10 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: NuGet paketlerini geri yükle
        run: dotnet restore FlowBrowser.csproj
      - name: Release derlemesini doğrula
        run: dotnet build FlowBrowser.csproj --configuration Release --no-restore
