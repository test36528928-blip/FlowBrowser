name: FlowBrowser Runner Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-runner:
    name: Linux runner capacity
    runs-on: ubuntu-latest
    steps:
      - name: Measure CPU, RAM and disk
        shell: bash
        run: |
          echo "=== CPU ==="
          printf 'Logical CPUs: '; nproc
          lscpu | grep -E 'Model name|CPU(s)' | head -5 || true
          echo "=== RAM ==="
          free -h
          awk '/MemTotal|MemAvailable|SwapTotal/ {printf "%s: %.2f GiB\\n", $1, $2/1024/1024}' /proc/meminfo
          echo "=== DISK ==="
          df -hT /
          echo "=== OS ==="
          uname -a

  windows-runner:
    name: Windows runner capacity
    runs-on: windows-latest
    steps:
      - name: Measure CPU, RAM and disk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Output "=== CPU ==="
          $cpu = Get-CimInstance -ClassName Win32_Processor
          Write-Output "Processor: $($cpu[0].Name)"
          Write-Output "Cores: $((($cpu | Measure-Object -Property NumberOfCores -Sum).Sum))"
          Write-Output "Logical processors: $env:NUMBER_OF_PROCESSORS"

          Write-Output "=== RAM ==="
          $computer = Get-CimInstance -ClassName Win32_ComputerSystem
          $ramGB = [math]::Round(($computer.TotalPhysicalMemory / 1GB), 2)
          Write-Output "Total physical RAM: $ramGB GB"

          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          $freeRamGB = [math]::Round(($os.FreePhysicalMemory * 1KB / 1GB), 2)
          Write-Output "Free physical RAM: $freeRamGB GB"

          Write-Output "=== DISK ==="
          $disks = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DriveType=3"
          foreach ($disk in $disks) {
            $sizeGB = [math]::Round(($disk.Size / 1GB), 2)
            $freeGB = [math]::Round(($disk.FreeSpace / 1GB), 2)
            Write-Output "$($disk.DeviceID) Total: $sizeGB GB | Free: $freeGB GB"
          }

          Write-Output "=== OS ==="
          Write-Output "$($os.Caption) | Version: $($os.Version) | Build: $($os.BuildNumber)"
